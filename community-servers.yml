# Community-submitted MCP servers
# Add your server by opening a PR. See CONTRIBUTING.md for guidelines.
#
# Required fields: name, github_url, package_name, description
# Optional fields: package_type (npm|pypi|docker), category
servers:
  - name: "BuyWhere MCP Server"
    github_url: "https://github.com/BuyWhere/buywhere-mcp"
    package_name: "@buywhere/mcp-server"
    description: "Search and compare products from Singapore, SEA, and US markets via Model Context Protocol. Cross-border e-commerce product catalog for AI agents."
    package_type: "npm"
    category: "other"
  - name: "Xquik"
    github_url: "https://github.com/Xquik-dev/x-twitter-scraper"
    package_name: "x-developer"
    description: "X and Twitter automation MCP server for tweet search, profile tweets, follower export, media workflows, webhooks, and confirmation-gated posting."
    package_type: "npm"
    category: "communication"
  - name: "SEO Tools: Yandex Wordstat"
    github_url: "https://github.com/antohins/seo-tools-mcp"
    package_name: "seo-tools-mcp-wordstat"
    description: "Yandex Wordstat keyword frequencies via the official API v2: broad and exact volume, dynamics over time, regional distribution with affinity index."
    package_type: "npm"
    category: "search"
  - name: "SEO Tools: Yandex.Webmaster"
    github_url: "https://github.com/antohins/seo-tools-mcp"
    package_name: "seo-tools-mcp-ywm"
    description: "Yandex.Webmaster read-only: search queries and their history, indexing and SQI trends, external and broken links, site diagnostics, sitemaps."
    package_type: "npm"
    category: "search"
  - name: "SEO Tools: Google Search Console"
    github_url: "https://github.com/antohins/seo-tools-mcp"
    package_name: "seo-tools-mcp-gsc"
    description: "Google Search Console read-only: Search Analytics with dimension filters and auto-pagination, URL Inspection, sitemaps and property permissions."
    package_type: "npm"
    category: "search"
  - name: "SEO Tools: Google Analytics 4"
    github_url: "https://github.com/antohins/seo-tools-mcp"
    package_name: "seo-tools-mcp-ga4"
    description: "Google Analytics 4 read-only: arbitrary Data API reports, period comparison, traffic sources, landing pages, events and realtime."
    package_type: "npm"
    category: "other"
  - name: "SEO Tools: Yandex.Metrica"
    github_url: "https://github.com/antohins/seo-tools-mcp"
    package_name: "seo-tools-mcp-metrika"
    description: "Yandex.Metrica read-only: arbitrary Stat API reports, time series, traffic sources, geo, devices, landing-page behaviour and organic search phrases."
    package_type: "npm"
    category: "other"
  - name: "SEO Tools: XMLStock SERP"
    github_url: "https://github.com/antohins/seo-tools-mcp"
    package_name: "seo-tools-mcp-xmlstock"
    description: "Google and Yandex SERP via XMLStock, plus Yandex Wordstat on the same key: organic results, image, news and video verticals, official Yandex XML engine."
    package_type: "npm"
    category: "search"
  - name: "SEO Tools: XMLRiver SERP"
    github_url: "https://github.com/antohins/seo-tools-mcp"
    package_name: "seo-tools-mcp-xmlriver"
    description: "Google and Yandex SERP via XMLRiver: organic results, Maps, People Also Ask, full AI Overview, search suggestions and URL indexation checks."
    package_type: "npm"
    category: "search"
  - name: "SEO Tools: A-Parser bridge"
    github_url: "https://github.com/antohins/seo-tools-mcp"
    package_name: "seo-tools-mcp-aparser"
    description: "Bridge to a self-hosted A-Parser instance: Google and Yandex SERP, suggestions and 150+ built-in parsers driven through its HTTP API, using your own proxies."
    package_type: "npm"
    category: "search"
