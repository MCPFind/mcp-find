# Community-submitted MCP servers
# Add your server by opening a PR. See CONTRIBUTING.md for guidelines.
#
# Required fields: name, github_url, package_name, description
# Optional fields: package_type (npm|pypi|docker), category
servers:
  - name: "BuyWhere MCP Server"
    github_url: "https://github.com/BuyWhere/buywhere-mcp"
    package_name: "@buywhere/mcp-server"
    description: "Search and compare products from Singapore, SEA, and US markets via Model Context Protocol. Cross-border e-commerce product catalog for AI agents."
    package_type: "npm"
    category: "other"
  - name: "Xquik"
    github_url: "https://github.com/Xquik-dev/x-twitter-scraper"
    package_name: "x-developer"
    description: "X and Twitter automation MCP server for tweet search, profile tweets, follower export, media workflows, webhooks, and confirmation-gated posting."
    package_type: "npm"
    category: "communication"
  - name: "Web Validator by DigestSEO"
    github_url: "https://github.com/AKzar1el/mcp-web-validator"
    package_name: "mcp-web-validator"
    description: "Validate HTML and CSS, audit technical SEO and JSON-LD, check public links, and capture responsive screenshots through MCP."
    package_type: "npm"
    category: "devtools"
  - name: "Google Search Console by DigestSEO"
    github_url: "https://github.com/AKzar1el/mcp-gsc"
    package_name: "@digestseo/mcp-gsc"
    description: "Connect AI agents to Google Search Console for search analytics, URL inspection, sitemap management, indexing requests, and SEO diagnostics."
    package_type: "npm"
    category: "search"
  - name: "GEO Tracker by DigestSEO"
    github_url: "https://github.com/AKzar1el/mcp-geo"
    package_name: "@digestseo/mcp-geo"
    description: "Track brand visibility, citations, competitors, and content gaps across major AI search engines through MCP."
    package_type: "npm"
    category: "search"
