name: Verify Submission Liveness

# Second-layer CI check: runs alongside structural validation (validate-pr.yml).
# Verifies that submitted github_url repos are public, have licenses, and that
# claimed packages actually exist on the declared registry.
#
# Fires on both accepted intake paths: community-servers.yml and submissions/.
#
# FORK SAFETY — this ordinary `pull_request` workflow executes PR code and is
# therefore intentionally read-only and secret-free. The separate preflight
# uses `pull_request_target` only for trusted base-revision code and API-fetched
# YAML data, so first-time fork contributors get feedback without approving
# their branch for execution.

on:
  pull_request:
    paths:
      - 'community-servers.yml'
      - 'submissions/**.yml'
      - 'submissions/**.yaml'

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-liveness:
    name: Liveness & Authenticity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Fetch both the PR head and the base so we can diff new entries only.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # yaml is also used by validate-pr.yml — install it the same way.
      - name: Install dependencies
        run: npm install --ignore-scripts --no-save yaml@2.7.0

      - name: Run liveness checks
        id: liveness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verify-submission-liveness.mjs
