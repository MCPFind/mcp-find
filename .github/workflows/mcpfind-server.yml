name: MCPFind server

on:
  pull_request:
    paths:
      - 'packages/mcp-server/**'
      - '.github/workflows/mcpfind-server.yml'
  push:
    branches: [main]
    paths:
      - 'packages/mcp-server/**'
      - '.github/workflows/mcpfind-server.yml'

permissions:
  contents: read

jobs:
  protocol:
    name: mcpfind-server-protocol
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mcpfind/server build
      - run: pnpm --filter @mcpfind/server test:protocol

  docs:
    name: mcpfind-server-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mcpfind/server build
      - run: pnpm --filter @mcpfind/server test:docs
      - run: npm pack --dry-run
        working-directory: packages/mcp-server
