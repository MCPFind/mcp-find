name: Daily Sync
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mcpfind/sync... build
      # Only actual source/enrichment/category changes advance updated_at.
      # Capture before writes so partial runs invalidate their successful rows.
      - name: Capture sync start timestamp
        id: sync_start
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Run sync pipeline
        id: sync
        # Leave enough of the job budget for ledger repair, cache invalidation,
        # and IndexNow even if the process itself stalls.
        run: timeout --signal=TERM --kill-after=30s 24m pnpm --filter @mcpfind/sync run start
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_ENRICHMENT_TOKEN: ${{ secrets.GH_ENRICHMENT_TOKEN }}
          # The Sep 14 run averaged about 1.7s per normalized repository over
          # its metadata, README, and contributor requests. Cap the row batch
          # at 300: even if every row is a distinct repository at 1.8s each,
          # the 15m stage retains six minutes for slower responses/retries.
          GH_ENRICHMENT_LIMIT: 300
          GH_ENRICHMENT_STAGE_TIMEOUT_MS: 900000
      - name: Ensure sync ledger is terminal
        if: ${{ always() && !cancelled() && steps.sync_start.outputs.ts != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_START: ${{ steps.sync_start.outputs.ts }}
        run: pnpm --filter @mcpfind/sync exec tsx src/ensure-terminal.ts
      # Determines the real changed-slug set for the cache-bust step below.
      # Paginated via PostgREST's Range header (default page size cap),
      # bounded at 20 pages / 20,000 rows as a safety ceiling for one
      # workflow run. On ANY failure (network, malformed response, missing
      # secrets) this step sets ok=false and the next step falls back to the
      # bounded stale-while-revalidate window. It never falls back to a
      # global cache purge, because a failed comparison is not proof every
      # server changed.
      - name: Determine changed slugs since sync start
        id: changed_slugs
        if: ${{ !cancelled() && steps.sync.outcome != 'skipped' && steps.sync_start.outputs.ts != '' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_START: ${{ steps.sync_start.outputs.ts }}
        run: |
          set -euo pipefail
          pages_dir="$(mktemp -d)"
          page=0
          ok=true
          while [ "$page" -lt 20 ]; do
            start=$((page * 1000))
            end=$((start + 999))
            if ! curl -sf --connect-timeout 10 --max-time 30 \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Range: ${start}-${end}" \
              "${SUPABASE_URL}/rest/v1/servers?select=slug,canonical_slug&order=id&updated_at=gte.${SYNC_START}" \
              -o "${pages_dir}/${page}.json"; then
              ok=false
              break
            fi
            count=$(jq 'length' "${pages_dir}/${page}.json")
            if [ "$count" -lt 1000 ]; then
              break
            fi
            page=$((page + 1))
          done
          if [ "$page" -ge 20 ]; then ok=false; fi
          if [ "$ok" = "true" ]; then
            jq -s '[.[][] | (.canonical_slug // .slug)] | unique' "${pages_dir}"/*.json > "${pages_dir}/all-slugs.json"
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "file=${pages_dir}/all-slugs.json" >> "$GITHUB_OUTPUT"
            echo "count=$(jq 'length' "${pages_dir}/all-slugs.json")" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bust Vercel cache
        if: ${{ !cancelled() && steps.sync.outcome != 'skipped' && steps.sync_start.outputs.ts != '' }}
        env:
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
          SLUGS_OK: ${{ steps.changed_slugs.outputs.ok }}
          SLUGS_FILE: ${{ steps.changed_slugs.outputs.file }}
        run: |
          set -euo pipefail
          revalidate() {
            curl -sf --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 5 \
              -X POST https://mcpfind.org/api/revalidate \
              -H "Content-Type: application/json" \
              -H "x-revalidate-token: ${REVALIDATE_TOKEN}" \
              -d "$1"
          }
          if [ "$SLUGS_OK" != "true" ]; then
            # A failed or capped comparison is not evidence that every server
            # changed. Preserve warm caches and let the seven-day ISR window
            # refresh safely rather than issuing a global purge.
            echo "::warning::Changed-slug discovery failed; skipped cache invalidation and retained time-based refresh."
            exit 0
          fi
          count=$(jq 'length' "$SLUGS_FILE")
          if [ "$count" -eq 0 ]; then
            echo "No changed server rows; cache remains warm."
            exit 0
          fi
          # The API accepts at most 5,000 slugs. Split rather than silently
          # truncating a larger repair run; each batch remains scoped to rows
          # with evidence of a changed canonical server record.
          offset=0
          while [ "$offset" -lt "$count" ]; do
            payload=$(jq --argjson offset "$offset" '{slugs: .[$offset:($offset + 5000)]}' "$SLUGS_FILE")
            revalidate "$payload"
            offset=$((offset + 5000))
          done
      # IndexNow is change-driven: notify Bing and other participating engines
      # only about canonical detail URLs whose source data changed. A failed
      # discovery notification is visible in the workflow but must not turn a
      # successfully persisted registry sync into a failed data run.
      - name: Notify IndexNow of changed server URLs
        if: ${{ !cancelled() && steps.changed_slugs.outputs.ok == 'true' && steps.changed_slugs.outputs.count != '0' }}
        continue-on-error: true
        env:
          INDEXNOW_KEY: 441d971f3ef7aa26f8afe37dfc123a8f
          SLUGS_FILE: ${{ steps.changed_slugs.outputs.file }}
        run: |
          set -euo pipefail
          count=$(jq 'length' "$SLUGS_FILE")
          offset=0
          while [ "$offset" -lt "$count" ]; do
            jq \
              --arg key "$INDEXNOW_KEY" \
              --arg keyLocation "https://mcpfind.org/${INDEXNOW_KEY}.txt" \
              --argjson offset "$offset" \
              '{host:"mcpfind.org", key:$key, keyLocation:$keyLocation, urlList:map("https://mcpfind.org/servers/" + .)[$offset:($offset + 10000)]}' \
              "$SLUGS_FILE" > /tmp/indexnow-payload.json
            curl --fail-with-body --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 5 \
              -X POST https://api.indexnow.org/indexnow \
              -H 'Content-Type: application/json; charset=utf-8' \
              --data-binary @/tmp/indexnow-payload.json
            offset=$((offset + 10000))
          done
