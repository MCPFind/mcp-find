name: Validate Community Submission

# Structural validation for community server submissions.
#
# Fires on both accepted intake paths: the hand-edited community-servers.yml and
# the one-file-per-server submissions/ directory that the /submit form writes
# into via GitHub's prefilled new-file link.
#
# FORK SAFETY — why there are no API calls in here:
# Almost every submission arrives as a `pull_request` from a fork. GitHub hands
# such a run a READ-ONLY GITHUB_TOKEN no matter what the `permissions:` block
# asks for. The previous version of this workflow requested
# `pull-requests: write` and reported by calling issues.createComment and
# issues.addLabels, so the moment a maintainer approved a fork run those calls
# 403'd — and since the comment was posted BEFORE core.setFailed, the 403 killed
# the step and the contributor got an opaque API error instead of the list of
# things to fix.
#
# The fix is to stop needing write access at all: the validator writes its
# verdict to the job summary (always available to a read-only token) and signals
# pass/fail through the check's exit code. Deliberately NOT fixed with
# `pull_request_target` — that would run trusted-context code against untrusted
# fork content, which is precisely the pattern this repository does not have and
# must not acquire.

on:
  pull_request:
    paths:
      - 'community-servers.yml'
      - 'submissions/**.yml'
      - 'submissions/**.yaml'

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Read-only. This workflow needs nothing else, and asking for more would only
# create the illusion of write access that forks never actually receive.
permissions:
  contents: read

jobs:
  validate:
    name: Structural validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The validator's only dependency. Installed directly rather than through
      # the workspace so this check stays fast and independent of the build.
      - name: Install dependencies
        run: npm install yaml@2.7.0

      # Writes a pass/fail breakdown to the job summary and exits non-zero on
      # any validation error, which turns the check red on the PR.
      - name: Validate submission
        run: node scripts/validate-submissions.mjs
